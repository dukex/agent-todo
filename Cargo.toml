[package]
name = "agent-todo"
version = "0.1.0"
edition = "2021"
authors = ["Duke <emersonalmeidax@gmail.com>"]
description = "A task management API for AI agents, built with Rust on Cloudflare Workers"
license = "MIT"
repository = "https://github.com/dukex/agent-todo"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.7", features = ['http', 'axum', 'd1'] }
worker-macros = { version = "0.7", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
tower-service = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
sha2 = "0.10"
hex = "0.4"
rand = { version = "0.9", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
